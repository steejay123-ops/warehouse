.card-hover:hover { transform: translateY(-2px); box-shadow: rgba(0, 0, 0, 0.08) 0px 12px 30px; }
.progress-bar { transition: width 1.2s cubic-bezier(0.4, 0, 0.2, 1); }
.toast { animation: 0.3s ease 0s 1 normal none running slideIn, 0.3s ease 3.7s 1 normal forwards running fadeOut; }
@keyframes slideIn { 
  0% { transform: translate(-100%); opacity: 0; }
  100% { transform: translate(0px); opacity: 1; }
}
@keyframes slideInRight { 
  0% { transform: translate(100%); opacity: 0; }
  100% { transform: translate(0px); opacity: 1; }
}
@keyframes slideInLeft { 
  0% { transform: translate(-100%); opacity: 0; }
  100% { transform: translate(0px); opacity: 1; }
}
@keyframes slideInUp { 
  0% { transform: translateY(100%); opacity: 0; }
  100% { transform: translateY(0px); opacity: 1; }
}
@keyframes slideInDown { 
  0% { transform: translateY(-100%); opacity: 0; }
  100% { transform: translateY(0px); opacity: 1; }
}
@keyframes fadeOut { 
  0% { opacity: 1; }
  100% { opacity: 0; }
}
.pulse-dot { animation: 2s ease 0s infinite normal none running pulseDot; }
@keyframes pulseDot { 
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.85); }
}
.qr-scan-line { animation: 2s linear 0s infinite normal none running scanLine; }
@keyframes scanLine { 
  0% { top: 10%; }
  100% { top: 85%; }
}
.modal-enter { animation: 0.25s ease 0s 1 normal forwards running modalIn; }
@keyframes modalIn { 
  0% { opacity: 0; transform: scale(0.95); }
  100% { opacity: 1; transform: scale(1); }
}
input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { appearance: none; margin: 0px; }
.terminal-text { font-family: "Courier New", monospace; }
.label-preview { font-family: "Courier New", monospace; border: 2px solid rgb(30, 41, 59); }
.drag-zone { transition: 0.2s; }
.drag-zone.dragover { background: rgb(238, 242, 255); border-color: rgb(99, 102, 241); }
.toggle-switch { position: relative; display: inline-block; width: 44px; height: 24px; }
.toggle-switch input { opacity: 0; width: 0px; height: 0px; }
.toggle-slider { position: absolute; cursor: pointer; inset: 0px; background-color: rgb(203, 213, 225); transition: 0.3s; border-radius: 12px; }
.toggle-slider::before { position: absolute; content: ""; height: 18px; width: 18px; right: 3px; bottom: 3px; background-color: rgb(255, 255, 255); transition: 0.3s; border-radius: 50%; }
input:checked + .toggle-slider { background-color: rgb(79, 70, 229); }
input:checked + .toggle-slider::before { right: calc(100% - 21px); }
@media (max-width: 768px) {
  .sidebar-collapsed { transform: translate(100%); transition: transform 0.3s; }
  .sidebar-open { transform: translate(0px) !important; }
}
@keyframes flash-status { 
  0% { background-color: transparent; }
  30% { background-color: rgba(59, 130, 246, 0.25); }
  100% { background-color: transparent; }
}
.status-updated-flash { animation: 3s ease-in-out 0s 1 normal forwards running flash-status; border-radius: 0.375rem; }
@media print {
  @page { size: a4 portrait; margin: 8mm; }
  html, body { background: rgb(255, 255, 255) !important; color: rgb(0, 0, 0) !important; margin: 0px !important; padding: 0px !important; -webkit-print-color-adjust: exact !important; }
  app-layout header, app-layout aside, app-layout nav, app-users > div > div:first-child, app-users nav, .toast-container, .toast, .no-print, button, .modal-backdrop { display: none !important; visibility: hidden !important; height: 0px !important; width: 0px !important; overflow: hidden !important; }
  #id-cards-print-sheet { display: block !important; visibility: visible !important; position: absolute !important; left: 0px !important; top: 0px !important; width: 100% !important; margin: 0px !important; padding: 0px !important; background: rgb(255, 255, 255) !important; z-index: 99999 !important; }
  #id-cards-print-sheet * { visibility: visible !important; }
}
