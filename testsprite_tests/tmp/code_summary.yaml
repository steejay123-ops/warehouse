version: "2"
type: frontend
tech_stack:
  - TypeScript
  - Angular
  - Tailwind CSS
routes:
  - path: /login
    file: src/app/components/login/login.ts
    auth_required: false
    description: User login page
  - path: /dashboard
    file: src/app/components/dashboard/dashboard.ts
    auth_required: true
    description: Main application dashboard
  - path: /projects
    file: src/app/components/projects/projects.ts
    auth_required: true
    description: Projects management
  - path: /dispatch
    file: src/app/components/dispatch/dispatch.ts
    auth_required: true
    description: Dispatch management
  - path: /users
    file: src/app/components/users/users.ts
    auth_required: true
    description: Users management
features:
  - name: User Login
    description: Login with credentials
    files:
      - src/app/components/login/login.ts
      - src/app/core/auth/auth.service.ts
    entry_route: /login
    user_interactions:
      - Fill username/email input field
      - Fill password input field
      - Click Login button to submit
    api_calls:
      - method: POST
        endpoint: /api/auth/login
    auth_required: false
  - name: Dashboard
    description: Main dashboard view
    files:
      - src/app/components/dashboard/dashboard.ts
    entry_route: /dashboard
    user_interactions:
      - View overview metrics
    api_calls: []
    auth_required: true
  - name: Dispatch
    description: Manage dispatches
    files:
      - src/app/components/dispatch/dispatch.ts
    entry_route: /dispatch
    user_interactions:
      - View dispatch lists
      - Edit dispatch items
    api_calls: []
    auth_required: true
known_limitations: []
