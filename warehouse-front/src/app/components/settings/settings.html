<div class="max-w-6xl mx-auto space-y-6 fade-in text-right pb-10" dir="rtl">
    
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-5 rounded-2xl border border-slate-200 shadow-sm sticky top-0 z-20">
      <div>
        <h3 class="font-black text-slate-800 text-sm flex items-center gap-2">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          پیکربندی کلان سیستم
        </h3>
        <p class="text-[11px] text-slate-500 mt-1.5">مدیریت تنظیمات سراسری سیستم شامل فرآیندهای انبارگردانی و تغذیه داده‌ها</p>
      </div>
      <button [disabled]="isLoading" (click)="saveGlobalSettings()" class="px-5 py-2.5 rounded-xl text-xs font-bold text-white shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2 hover:shadow-indigo-200" style="background:linear-gradient(135deg,#4f46e5,#7c3aed)">
        <span *ngIf="isLoading" class="animate-spin w-4 h-4 border-2 border-white border-t-transparent rounded-full"></span>
        <svg *ngIf="!isLoading" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        ذخیره و اعمال تنظیمات
      </button>
    </div>

    <!-- Tabs Navigation -->
    <div *ngIf="!isLoading" class="mb-6 flex overflow-x-auto bg-white rounded-2xl border border-slate-200 p-1.5 shadow-sm gap-2 relative z-10">
      <button 
        type="button"
        (click)="setTab('operations')"
        [class.bg-indigo-50]="activeTab === 'operations'"
        [class.text-indigo-700]="activeTab === 'operations'"
        [class.font-black]="activeTab === 'operations'"
        [class.text-slate-500]="activeTab !== 'operations'"
        [class.hover:bg-slate-50]="activeTab !== 'operations'"
        class="flex-1 min-w-[200px] px-5 py-3.5 rounded-xl text-xs transition-all flex items-center justify-center gap-2.5 whitespace-nowrap outline-none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" [attr.stroke]="activeTab === 'operations' ? '#4f46e5' : 'currentColor'" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        قوانین عملیاتی و انبارگردانی فیزیکی
      </button>
      
      <button 
        type="button"
        (click)="setTab('label')"
        [class.bg-indigo-50]="activeTab === 'label'"
        [class.text-indigo-700]="activeTab === 'label'"
        [class.font-black]="activeTab === 'label'"
        [class.text-slate-500]="activeTab !== 'label'"
        [class.hover:bg-slate-50]="activeTab !== 'label'"
        class="flex-1 min-w-[200px] px-5 py-3.5 rounded-xl text-xs transition-all flex items-center justify-center gap-2.5 whitespace-nowrap outline-none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" [attr.stroke]="activeTab === 'label' ? '#4f46e5' : 'currentColor'" stroke-width="2.5"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        طراح لیبل (Global)
      </button>
    </div>

    <!-- Tabs Content -->
    <div *ngIf="!isLoading" class="w-full">
      
      <!-- فرآیندهای انبارگردانی -->
      <div *ngIf="activeTab === 'operations'" class="space-y-6 fade-in">
        <div class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
          <div class="bg-slate-50 border-b border-slate-100 p-5">
            <h4 class="font-black text-slate-800 text-[13px] flex items-center gap-2">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
              قوانین عملیاتی و انبارگردانی فیزیکی
            </h4>
          </div>
          <div class="p-6 space-y-6">
            
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-2.5">تایید نهایی شمارش توسط مدیریت</label>
              <select [(ngModel)]="settings.manager_approval_mode" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-[13px] font-semibold text-slate-700 outline-none focus:border-indigo-400 focus:ring-4 focus:ring-indigo-400/10 appearance-none cursor-pointer transition-all">
                <option value="any_manager">امکان تایید توسط همه مدیران (استخر مشترک)</option>
                <option value="assigned_manager_only">فقط مدیری که کار را ارجاع داده مجاز به تایید است</option>
              </select>
            </div>

            <div class="flex items-center justify-between p-5 bg-white rounded-2xl border border-slate-200 hover:border-indigo-300 transition-colors shadow-sm cursor-pointer" (click)="settings.require_supervisor_approval = !settings.require_supervisor_approval">
              <div class="pl-4">
                <h5 class="text-[13px] font-black text-slate-800">تایید اجباری سرپرست</h5>
                <p class="text-[11px] text-slate-500 mt-2 leading-relaxed font-medium">آیا کارهای شمارش شده قبل از رسیدن به دست مدیر باید توسط سرپرست نیز تایید شوند؟</p>
              </div>
              <label class="toggle-switch shrink-0 mr-auto pointer-events-none">
                <input type="checkbox" [checked]="settings.require_supervisor_approval">
                <span class="toggle-slider"></span>
              </label>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 mb-2.5">حالت نمایش موجودی سیستمی (شمارش کور)</label>
              <select [(ngModel)]="settings.blind_counting" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-[13px] font-semibold text-slate-700 outline-none focus:border-indigo-400 focus:ring-4 focus:ring-indigo-400/10 appearance-none cursor-pointer transition-all">
                <option value="blind">کور (شمارشگر موجودی سیستمی را نبیند)</option>
                <option value="visible">قابل مشاهده برای شمارشگر</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 mb-2.5">حداکثر دفعات مجاز بازشماری</label>
              <select [(ngModel)]="settings.max_recounts" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-[13px] font-semibold text-slate-700 outline-none focus:border-indigo-400 focus:ring-4 focus:ring-indigo-400/10 appearance-none cursor-pointer transition-all">
                <option [ngValue]="-1">بی‌نهایت (بدون محدودیت)</option>
                <option [ngValue]="1">یک بار</option>
                <option [ngValue]="2">دو بار</option>
                <option [ngValue]="3">سه بار</option>
              </select>
            </div>

            <div class="h-px bg-slate-200 w-full my-6"></div>
            
            <div>
              <h5 class="font-black text-slate-800 text-[13px] flex items-center gap-2 mb-4">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2.5"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
                یکپارچگی داده‌ها (آپلود اکسل)
              </h5>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 mb-2.5">رفتار پیش‌فرض هنگام تداخل رکوردهای اکسل</label>
              <select [(ngModel)]="settings.default_conflict_strategy" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-[13px] font-semibold text-slate-700 outline-none focus:border-indigo-400 focus:ring-4 focus:ring-indigo-400/10 appearance-none cursor-pointer transition-all">
                <option value="ignore">نادیده گرفتن رکورد تکراری (حفظ داده‌های فعلی سیستم)</option>
                <option value="replace">جایگزینی اجباری (Over-write)</option>
                <option value="update_empty">تکمیل مقادیر خالی بدون تغییر مقادیر موجود</option>
                <option value="log">توقف پردازش آن سطر و ثبت در لاگ خطا</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 mb-2.5">وضعیت پیش‌فرض لیبل برای کالاهای جدید</label>
              <select [(ngModel)]="settings.default_tag_status" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-[13px] font-semibold text-slate-700 outline-none focus:border-indigo-400 focus:ring-4 focus:ring-indigo-400/10 appearance-none cursor-pointer transition-all">
                <option value="عدم نیاز به چاپ">عدم نیاز به چاپ</option>
                <option value="چاپ نشده">نیاز به چاپ (چاپ نشده)</option>
                <option value="چاپ شده">چاپ شده</option>
              </select>
            </div>

          </div>
        </div>
      </div>

      <!-- Label Designer Section -->
      <div *ngIf="activeTab === 'label'" class="fade-in">
        <div class="bg-white rounded-3xl border border-slate-200 overflow-hidden shadow-sm">
          <div class="bg-slate-50 border-b border-slate-200 p-5">
            <h4 class="font-black text-slate-800 text-[13px] flex items-center gap-2">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2.5"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
              طراح لیبل (Global)
            </h4>
          </div>
          <div class="p-6">
            <app-label-designer></app-label-designer>
          </div>
        </div>
      </div>

    </div>
</div>
